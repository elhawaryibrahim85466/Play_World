<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>النرد - PlayWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #0D0F1D;
  background-image:
    radial-gradient(circle at 50% 35%, rgba(245,158,11,0.15) 0%, transparent 50%),
    radial-gradient(circle at 15% 10%, rgba(139,92,246,0.15), transparent 40%);
  background-attachment: fixed;
  padding-bottom: 30px;
}

.dice-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 30px auto 24px;
}

.dice {
  width: 110px;
  height: 110px;
  border-radius: 20px;
  background: linear-gradient(135deg, #fcf6ba 0%, #bf953f 40%, #8b6508 100%);
  border: 2px solid #5c3a09;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  font-weight: 900;
  color: #0D0F1D;
  box-shadow:
    0 0 25px rgba(245,158,11,0.45),
    0 12px 28px rgba(0,0,0,0.55),
    inset 0 3px 8px rgba(255,255,255,0.6);
}
.dice.rolling { animation: diceRoll 0.6s linear infinite; }
@keyframes diceRoll {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.section {
  max-width: 340px;
  margin: 0 auto 14px;
}
.section-label {
  font-size: 12px;
  color: #9CA3AF;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: right;
}

.amount-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 16px;
  font-weight: 900;
  color: #F59E0B;
  font-family: inherit;
  text-align: center;
  outline: none;
  margin-bottom: 8px;
  box-sizing: border-box;
}
.amount-input::placeholder { color: #4B5563; font-weight: 700; }
.amount-input:focus { border-color: rgba(245,158,11,0.5); }

.quick-btns {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.quick-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 8px 0;
  font-size: 11px;
  font-weight: 800;
  color: #9CA3AF;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.quick-btn:active { transform: scale(0.93); }
.quick-btn.active {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: #0D0F1D;
  border-color: rgba(255,255,255,0.3);
}

.guess-buttons {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.guess-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 12px 0;
  font-size: 16px;
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.guess-btn:active { transform: scale(0.92); }
.guess-btn.selected {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: #0D0F1D;
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 4px 15px rgba(245,158,11,0.4);
}

.play-btn {
  display: block;
  width: 100%;
  max-width: 340px;
  margin: 20px auto 14px;
  background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 40%, #D97706 100%);
  color: #0D0F1D;
  font-weight: 900;
  font-size: 16px;
  padding: 15px 0;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.35);
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 8px 25px rgba(245,158,11,0.4), 0 4px 0 #92400E, inset 0 1px 0 rgba(255,255,255,0.5);
  transition: transform 0.1s ease;
}
.play-btn:active { transform: translateY(3px); }
.play-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.info {
  text-align: center;
  margin-top: 14px;
  font-size: 12px;
  color: #9CA3AF;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" style="width:42px;height:42px;border-radius:14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;color:#F59E0B;text-decoration:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="logo-text" style="font-size:18px;">🎲 النرد</div>
  
  
  <div style="display:flex;align-items:center;"><a href="game-shop.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#F59E0B;text-decoration:none;margin-left:15px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 5 H6 L8 16 H19 L21 7 H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
    </svg>
  </a><div class="balance-card">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
      <defs>
        <radialGradient id="pwCoinGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#FEF3C7"/>
          <stop offset="45%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#B45309"/>
        </radialGradient>
        <radialGradient id="pwCoinInner" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#FFFBEB"/>
          <stop offset="50%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#D97706"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="#92400E"/>
      <circle cx="16" cy="16" r="14" fill="url(#pwCoinGrad)"/>
      <circle cx="16" cy="16" r="11" fill="url(#pwCoinInner)" stroke="#92400E" stroke-width="0.6"/>
      <text x="16" y="20" text-anchor="middle" font-size="9" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
      <ellipse cx="12" cy="10" rx="4" ry="2.2" fill="rgba(255,255,255,0.55)"/>
    </svg>
    <span class="value" data-balance>0</span>
  </div></div>
  
</div>

<div class="dice-wrapper">
  <div class="dice" id="dice">?</div>
</div>

<div class="section">
  <div class="section-label">💰 مبلغ اللعب (1 - 100):</div>
  <input type="text" inputmode="numeric" pattern="[0-9]*" class="amount-input" id="amountInput" placeholder="اكتب المبلغ" oninput="capAmount(this)">
  <div class="quick-btns">
    <button class="quick-btn" onclick="setAmount(5, this)">5</button>
    <button class="quick-btn" onclick="setAmount(10, this)">10</button>
    <button class="quick-btn" onclick="setAmount(25, this)">25</button>
    <button class="quick-btn" onclick="setAmount(50, this)">50</button>
    <button class="quick-btn" onclick="setAmount(75, this)">75</button>
    <button class="quick-btn" onclick="setAmount(100, this)">100</button>
  </div>
</div>

<div class="section">
  <div class="section-label">🎯 توقع الرقم (1 - 6):</div>
  <div class="guess-buttons">
    <button class="guess-btn" data-num="1" onclick="selectGuess(1)">1</button>
    <button class="guess-btn" data-num="2" onclick="selectGuess(2)">2</button>
    <button class="guess-btn" data-num="3" onclick="selectGuess(3)">3</button>
    <button class="guess-btn" data-num="4" onclick="selectGuess(4)">4</button>
    <button class="guess-btn" data-num="5" onclick="selectGuess(5)">5</button>
    <button class="guess-btn" data-num="6" onclick="selectGuess(6)">6</button>
  </div>
</div>

<button class="play-btn" id="playBtn" onclick="playDice()">العب 🎲</button>

<div class="info">✅ صح → مكافأة 1.5x</div>



<script src="app.js"></script>
<script>
let selectedNumber = null;
let playing = false;

function capAmount(input) {
  // Remove any non-digit characters
  input.value = input.value.replace(/[^0-9]/g, '');
  let v = Number(input.value);
  if (v > 100) input.value = 100;
  else if (v < 1 && input.value !== '') input.value = 1;
}

function setAmount(v, btn) {
  const input = document.getElementById('amountInput');
  input.value = v;
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function selectGuess(num) {
  if (playing) return;
  selectedNumber = num;
  document.querySelectorAll('.guess-btn').forEach(b => {
    b.classList.toggle('selected', Number(b.dataset.num) === num);
  });
}

function playDice() {
  if (playing) return;

  const amountInput = document.getElementById('amountInput');
  let amount = Number(amountInput.value);

  if (!amount || amount < 1) { PW.showToast('اكتب مبلغ صحيح'); return; }
  if (amount > 100) { PW.showToast('الحد الأقصى 100'); return; }
  if (!selectedNumber) { PW.showToast('اختر رقم الأول'); return; }

  const balance = PW.getBalance();
  if (balance < amount) { PW.showToast('رصيدك غير كافٍ'); return; }

  playing = true;
  PW.setBalance(balance - amount);

  const btn = document.getElementById('playBtn');
  btn.disabled = true;

  const dice = document.getElementById('dice');
  dice.classList.add('rolling');
  dice.innerText = '?';

  let counter = 0;
  const interval = setInterval(() => {
    dice.innerText = Math.floor(Math.random() * 6) + 1;
    counter++;
    if (counter > 15) {
      clearInterval(interval);
      dice.classList.remove('rolling');

      const result = Math.floor(Math.random() * 6) + 1;
      dice.innerText = result;

      setTimeout(() => {
        if (result === selectedNumber) {
          const reward = Math.round((amount * 1.5) * 100) / 100;
          PW.addBalance(reward);
          PW.showToast('🎉 صح! مكافأة +' + reward + ' كوين');
        } else {
          PW.showToast('❌ غلط، الرقم كان ' + result);
        }
        playing = false;
        btn.disabled = false;
      }, 300);
    }
  }, 70);
}
</script>

</body>
</html>
