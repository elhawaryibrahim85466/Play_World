<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PlayWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M7 8 H17 A5 5 0 0 1 22 13 V15 A3 3 0 0 1 17.5 17 L15.5 15 H8.5 L6.5 17 A3 3 0 0 1 2 15 V13 A5 5 0 0 1 7 8 Z" fill="#0D0F1D" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="7" cy="12" r="1.2" fill="#fff"/>
        <circle cx="9.5" cy="14.5" r="1.2" fill="#fff"/>
        <circle cx="17" cy="12" r="1.5" fill="#F59E0B"/>
        <circle cx="14.5" cy="14.5" r="1.5" fill="#F59E0B"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">PlayWorld</div>
      <div class="logo-sub">Game Hub</div>
    </div>
  </div>
  <div class="balance-card">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#F59E0B"/>
      <circle cx="12" cy="12" r="8" fill="#FBBF24"/>
      <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="900" fill="#92400E">$</text>
    </svg>
    <span class="value" data-balance>0</span>
  </div>
</div>

<div class="section-title">🎮 اختر لعبتك</div>
<div class="games-grid">

  <a href="wheel.html" class="game-card active-game">
    <div class="game-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="icGoldRing" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fcf6ba"/>
            <stop offset="25%" stop-color="#bf953f"/>
            <stop offset="50%" stop-color="#8b6508"/>
            <stop offset="75%" stop-color="#bf953f"/>
            <stop offset="100%" stop-color="#fcf6ba"/>
          </linearGradient>
          <radialGradient id="icRed" cx="50%" cy="50%" r="80%">
            <stop offset="0%" stop-color="#7a0d0d"/>
            <stop offset="60%" stop-color="#b31a1a"/>
            <stop offset="100%" stop-color="#d62828"/>
          </radialGradient>
          <radialGradient id="icCream" cx="50%" cy="50%" r="80%">
            <stop offset="0%" stop-color="#c9a45c"/>
            <stop offset="60%" stop-color="#e6c98a"/>
            <stop offset="100%" stop-color="#f7e5b8"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#icGoldRing)"/>
        <circle cx="32" cy="32" r="25" fill="#0D0F1D"/>
        <path d="M32,32 L32,7 A25,25 0 0,1 53.6,19.5 Z" fill="url(#icRed)"/>
        <path d="M32,32 L53.6,19.5 A25,25 0 0,1 53.6,44.5 Z" fill="url(#icCream)"/>
        <path d="M32,32 L53.6,44.5 A25,25 0 0,1 32,57 Z" fill="url(#icRed)"/>
        <path d="M32,32 L32,57 A25,25 0 0,1 10.4,44.5 Z" fill="url(#icCream)"/>
        <path d="M32,32 L10.4,44.5 A25,25 0 0,1 10.4,19.5 Z" fill="url(#icRed)"/>
        <path d="M32,32 L10.4,19.5 A25,25 0 0,1 32,7 Z" fill="url(#icCream)"/>
        <circle cx="32" cy="32" r="6" fill="url(#icGoldRing)" stroke="#5c3a09" stroke-width="0.8"/>
        <circle cx="32" cy="32" r="4" fill="#8b1414"/>
      </svg>
    </div>
    <div class="game-name">عجلة الحظ</div>
    <div class="game-action"><span class="play-btn">العب الآن</span></div>
  </a>

  <div class="game-card" onclick="comingSoon()">
    <div class="game-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="10" y="10" width="44" height="44" rx="10" fill="url(#diceGrad)" stroke="#F59E0B" stroke-width="2"/>
        <circle cx="22" cy="22" r="4" fill="#0D0F1D"/>
        <circle cx="42" cy="22" r="4" fill="#0D0F1D"/>
        <circle cx="22" cy="42" r="4" fill="#0D0F1D"/>
        <circle cx="42" cy="42" r="4" fill="#0D0F1D"/>
        <circle cx="32" cy="32" r="4" fill="#0D0F1D"/>
        <defs>
          <linearGradient id="diceGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#D97706"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="game-name">النرد</div>
    <div class="game-action"><div class="game-status">قريباً</div></div>
  </div>

  <div class="game-card" onclick="comingSoon()">
    <div class="game-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="8" width="48" height="48" rx="12" fill="url(#numGrad)" stroke="#F59E0B" stroke-width="2"/>
        <text x="32" y="42" text-anchor="middle" font-size="26" font-weight="900" fill="#0D0F1D">؟</text>
        <defs>
          <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#0891B2"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="game-name">تخمين الرقم</div>
    <div class="game-action"><div class="game-status">قريباً</div></div>
  </div>

  <div class="game-card" onclick="comingSoon()">
    <div class="game-icon">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M8 18 H56 V26 A6 6 0 0 0 56 38 V46 H8 V38 A6 6 0 0 0 8 26 Z" fill="url(#tickGrad)" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
        <line x1="20" y1="22" x2="20" y2="42" stroke="#0D0F1D" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
        <line x1="44" y1="22" x2="44" y2="42" stroke="#0D0F1D" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
        <circle cx="32" cy="32" r="6" fill="#0D0F1D" opacity="0.85"/>
        <path d="M29 32 L31 34 L35 30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="tickGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#EC4899"/>
            <stop offset="100%" stop-color="#BE185D"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="game-name">خربش واكسب</div>
    <div class="game-action"><div class="game-status">قريباً</div></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3 10 L12 3 L21 10 V20 A1 1 0 0 1 20 21 H15 V15 H9 V21 H4 A1 1 0 0 1 3 20 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    الرئيسية
  </a>
  <a href="tasks.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8 8 H16 M8 12 H16 M8 16 H12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    المهام
  </a>
  <a href="#" class="nav-item" onclick="PW.showToast('هذا القسم قريباً 🚀'); return false;">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 5 H6 L8 16 H19 L21 7 H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
    </svg>
    المتجر
  </a>
  <a href="friends.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M3 20 A6 6 0 0 1 15 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="17" cy="9" r="2.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="M16 14 A5 5 0 0 1 21 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    الأصدقاء
  </a>
</nav>

<script src="app.js"></script>
<script>
function comingSoon() {
  PW.showToast('هذه اللعبة ستتوفر قريباً 🚀');
}
</script>

</body>
</html>
