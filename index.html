<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayWorld</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background:#1a1a2e; color:#fff; font-family:sans-serif; text-align:center; padding:20px; }
h1 { color:#f0c040; }
button { background:#f0c040; border:none; padding:15px 30px; border-radius:10px; font-size:18px; font-weight:bold; margin-top:20px; }
</style>
</head>
<body>
<h1>🎰 PlayWorld</h1>
<p>رصيدك: <span id="balance">100</span> كوين</p>
<button onclick="play()">العب 🎲</button>
<script>
let balance = 100;
function play() {
  let win = Math.floor(Math.random() * 50);
  balance += win;
  document.getElementById("balance").innerText = balance;
  alert("كسبت " + win + " كوين!");
}
</script>
</body>
</html>
