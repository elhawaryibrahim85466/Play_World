<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>متجر الألعاب - PlayWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body { padding-bottom: 30px; }

.section-title {
  font-size: 13px; font-weight: 800;
  color: #9CA3AF; margin: 20px 0 12px;
}

.shop-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}

.shop-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px; padding: 16px 12px;
  text-align: center;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 180px;
  transition: transform 0.15s ease;
  cursor: pointer;
}
.shop-card:active { transform: scale(0.96); }

.shop-coins {
  display: flex; justify-content: center; align-items: center;
  margin-bottom: 10px; height: 50px;
}
.shop-coins svg { width: 46px; height: 46px; }

.shop-name { font-size: 12px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.shop-price { font-size: 14px; font-weight: 900; color: #F59E0B; margin-bottom: 10px; }

.buy-btn {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: #0D0F1D; font-weight: 900; font-size: 11px;
  padding: 8px 0; border-radius: 10px;
  border: none; cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 12px rgba(245,158,11,0.3);
}
.buy-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div class="header">
  <a href="javascript:history.back()" style="width:42px;height:42px;border-radius:14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;color:#F59E0B;text-decoration:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="logo-text" style="font-size:18px;">🎮 متجر الألعاب</div>
  
  <div style="display:flex;align-items:center;"><a href="game-shop.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#F59E0B;text-decoration:none;margin-left:15px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 5 H6 L8 16 H19 L21 7 H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
    </svg>
  </a><div class="balance-card">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
      <defs>
        <radialGradient id="pwCoinGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#FEF3C7"/>
          <stop offset="45%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#B45309"/>
        </radialGradient>
        <radialGradient id="pwCoinInner" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#FFFBEB"/>
          <stop offset="50%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#D97706"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="#92400E"/>
      <circle cx="16" cy="16" r="14" fill="url(#pwCoinGrad)"/>
      <circle cx="16" cy="16" r="11" fill="url(#pwCoinInner)" stroke="#92400E" stroke-width="0.6"/>
      <text x="16" y="20" text-anchor="middle" font-size="9" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
      <ellipse cx="12" cy="10" rx="4" ry="2.2" fill="rgba(255,255,255,0.55)"/>
    </svg>
    <span class="value" data-balance>0</span>
  </div></div>
</div>

<div class="section-title">💰 باقات الكوينز</div>
<div class="shop-grid">

  <!-- Pack 1: 1,000 PW coins — single coin -->
  <div class="shop-card" onclick="PW.showToast('الدفع قريباً 🚀')">
    <div>
      <div class="shop-coins">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="g1" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#FEF3C7"/>
              <stop offset="45%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#B45309"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="50" rx="28" ry="8" fill="#78350F" opacity="0.4"/>
          <circle cx="50" cy="28" r="22" fill="#92400E"/>
          <circle cx="50" cy="28" r="20" fill="url(#g1)"/>
          <circle cx="50" cy="28" r="15" fill="#FBBF24" stroke="#92400E" stroke-width="1"/>
          <text x="50" y="33" text-anchor="middle" font-size="12" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <ellipse cx="43" cy="18" rx="6" ry="3" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
      <div class="shop-name">باقة صغيرة</div>
      <div class="shop-price">1,000</div>
    </div>
    <button class="buy-btn">شراء</button>
  </div>

  <!-- Pack 2: 5,000 PW coins — small pile (3 coins) -->
  <div class="shop-card" onclick="PW.showToast('الدفع قريباً 🚀')">
    <div>
      <div class="shop-coins">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="g2" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#FEF3C7"/>
              <stop offset="45%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#B45309"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="52" rx="38" ry="8" fill="#78350F" opacity="0.4"/>
          <!-- bottom row -->
          <circle cx="34" cy="42" r="14" fill="#92400E"/><circle cx="34" cy="42" r="12" fill="url(#g2)"/>
          <text x="34" y="46" text-anchor="middle" font-size="8" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="66" cy="42" r="14" fill="#92400E"/><circle cx="66" cy="42" r="12" fill="url(#g2)"/>
          <text x="66" y="46" text-anchor="middle" font-size="8" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- top -->
          <circle cx="50" cy="26" r="14" fill="#92400E"/><circle cx="50" cy="26" r="12" fill="url(#g2)"/>
          <text x="50" y="30" text-anchor="middle" font-size="8" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <ellipse cx="46" cy="20" rx="4" ry="2" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
      <div class="shop-name">باقة متوسطة</div>
      <div class="shop-price">5,000</div>
    </div>
    <button class="buy-btn">شراء</button>
  </div>

  <!-- Pack 3: 10,000 PW coins — bigger pile (6 coins) -->
  <div class="shop-card" onclick="PW.showToast('الدفع قريباً 🚀')">
    <div>
      <div class="shop-coins">
        <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="g3" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#FEF3C7"/>
              <stop offset="45%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#B45309"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="62" rx="46" ry="8" fill="#78350F" opacity="0.4"/>
          <!-- bottom row (3) -->
          <circle cx="20" cy="50" r="13" fill="#92400E"/><circle cx="20" cy="50" r="11" fill="url(#g3)"/>
          <text x="20" y="54" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="50" cy="50" r="13" fill="#92400E"/><circle cx="50" cy="50" r="11" fill="url(#g3)"/>
          <text x="50" y="54" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="80" cy="50" r="13" fill="#92400E"/><circle cx="80" cy="50" r="11" fill="url(#g3)"/>
          <text x="80" y="54" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- middle row (2) -->
          <circle cx="35" cy="36" r="13" fill="#92400E"/><circle cx="35" cy="36" r="11" fill="url(#g3)"/>
          <text x="35" y="40" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="65" cy="36" r="13" fill="#92400E"/><circle cx="65" cy="36" r="11" fill="url(#g3)"/>
          <text x="65" y="40" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- top (1) -->
          <circle cx="50" cy="20" r="13" fill="#92400E"/><circle cx="50" cy="20" r="11" fill="url(#g3)"/>
          <text x="50" y="24" text-anchor="middle" font-size="7" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <ellipse cx="46" cy="14" rx="4" ry="2" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
      <div class="shop-name">باقة كبيرة</div>
      <div class="shop-price">10,000</div>
    </div>
    <button class="buy-btn">شراء</button>
  </div>

  <!-- Pack 4: 50,000 PW coins — big pyramid (10 coins) -->
  <div class="shop-card">
    <div>
      <div class="shop-coins">
        <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="g4" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#FEF3C7"/>
              <stop offset="45%" stop-color="#F59E0B"/>
              <stop offset="100%" stop-color="#B45309"/>
            </radialGradient>
          </defs>
          <ellipse cx="50" cy="72" rx="46" ry="8" fill="#78350F" opacity="0.4"/>
          <!-- row 1 (4 coins) -->
          <circle cx="14" cy="60" r="12" fill="#92400E"/><circle cx="14" cy="60" r="10" fill="url(#g4)"/>
          <text x="14" y="63" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="38" cy="60" r="12" fill="#92400E"/><circle cx="38" cy="60" r="10" fill="url(#g4)"/>
          <text x="38" y="63" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="62" cy="60" r="12" fill="#92400E"/><circle cx="62" cy="60" r="10" fill="url(#g4)"/>
          <text x="62" y="63" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="86" cy="60" r="12" fill="#92400E"/><circle cx="86" cy="60" r="10" fill="url(#g4)"/>
          <text x="86" y="63" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- row 2 (3) -->
          <circle cx="26" cy="46" r="12" fill="#92400E"/><circle cx="26" cy="46" r="10" fill="url(#g4)"/>
          <text x="26" y="49" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="50" cy="46" r="12" fill="#92400E"/><circle cx="50" cy="46" r="10" fill="url(#g4)"/>
          <text x="50" y="49" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="74" cy="46" r="12" fill="#92400E"/><circle cx="74" cy="46" r="10" fill="url(#g4)"/>
          <text x="74" y="49" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- row 3 (2) -->
          <circle cx="38" cy="32" r="12" fill="#92400E"/><circle cx="38" cy="32" r="10" fill="url(#g4)"/>
          <text x="38" y="35" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <circle cx="62" cy="32" r="12" fill="#92400E"/><circle cx="62" cy="32" r="10" fill="url(#g4)"/>
          <text x="62" y="35" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <!-- row 4 (1) -->
          <circle cx="50" cy="18" r="12" fill="#92400E"/><circle cx="50" cy="18" r="10" fill="url(#g4)"/>
          <text x="50" y="21" text-anchor="middle" font-size="6" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
          <ellipse cx="46" cy="12" rx="4" ry="2" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
      <div class="shop-name">باقة VIP</div>
      <div class="shop-price">50,000</div>
    </div>
    <div class="soon-badge">قريباً</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
