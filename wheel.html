<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>عجلة الحظ - PlayWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #0D0F1D;
  background-image:
    radial-gradient(circle at 50% 35%, rgba(245,158,11,0.15) 0%, transparent 50%),
    radial-gradient(circle at 15% 10%, rgba(139,92,246,0.15), transparent 40%);
  background-attachment: fixed;
  padding-bottom: 30px;
}

.wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 20px auto 24px; }

.wheel-top-pointer {
  position: absolute;
  top: -18px; left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 38px;
  z-index: 20;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
}
.wheel-top-pointer svg { width: 100%; height: 100%; display: block; }

.wheel-disc {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border-radius: 50%;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
  transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
  transform-origin: 50% 50%;
  will-change: transform;
}

.wheel-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 68px; height: 68px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fcf6ba, #bf953f 45%, #8b6508 100%);
  border: 3px solid #5c3a09;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900;
  color: #4a0606;
  letter-spacing: 0.5px;
  z-index: 6;
  box-shadow: 0 0 20px rgba(245,158,11,0.5), inset 0 2px 4px rgba(255,255,255,0.5);
}

.section { max-width: 340px; margin: 0 auto 14px; }
.section-label {
  font-size: 12px; color: #9CA3AF; font-weight: 700;
  margin-bottom: 8px; text-align: right;
}

.amount-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 16px; font-weight: 900;
  color: #F59E0B;
  font-family: inherit;
  text-align: center;
  outline: none;
  margin-bottom: 8px;
  box-sizing: border-box;
}
.amount-input::placeholder { color: #4B5563; font-weight: 700; }
.amount-input:focus { border-color: rgba(245,158,11,0.5); }

.quick-btns {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.quick-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 8px 0;
  font-size: 11px; font-weight: 800;
  color: #9CA3AF;
  cursor: pointer; font-family: inherit;
}
.quick-btn:active { transform: scale(0.93); }
.quick-btn.active {
  background: linear-gradient(135deg, #F59E0B, #D97706);
  color: #0D0F1D;
  border-color: rgba(255,255,255,0.3);
}

.play-btn {
  display: block;
  width: 100%; max-width: 340px;
  margin: 20px auto 14px;
  background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 40%, #D97706 100%);
  color: #0D0F1D; font-weight: 900; font-size: 16px;
  padding: 15px 0; border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.35);
  cursor: pointer; font-family: inherit;
  box-shadow: 0 8px 25px rgba(245,158,11,0.4), 0 4px 0 #92400E, inset 0 1px 0 rgba(255,255,255,0.5);
}
.play-btn:active { transform: translateY(3px); }
.play-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.info {
  text-align: center; margin-top: 14px;
  font-size: 12px; color: #9CA3AF; font-weight: 700;
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" style="width:42px;height:42px;border-radius:14px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;color:#F59E0B;text-decoration:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="logo-text" style="font-size:18px;">🎡 عجلة الحظ</div>
  
  
  <div style="display:flex;align-items:center;"><a href="game-shop.html" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#F59E0B;text-decoration:none;margin-left:15px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 5 H6 L8 16 H19 L21 7 H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
    </svg>
  </a><div class="balance-card">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
      <defs>
        <radialGradient id="pwCoinGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#FEF3C7"/>
          <stop offset="45%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#B45309"/>
        </radialGradient>
        <radialGradient id="pwCoinInner" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#FFFBEB"/>
          <stop offset="50%" stop-color="#FBBF24"/>
          <stop offset="100%" stop-color="#D97706"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="#92400E"/>
      <circle cx="16" cy="16" r="14" fill="url(#pwCoinGrad)"/>
      <circle cx="16" cy="16" r="11" fill="url(#pwCoinInner)" stroke="#92400E" stroke-width="0.6"/>
      <text x="16" y="20" text-anchor="middle" font-size="9" font-weight="900" fill="#78350F" font-family="Cairo, sans-serif">PW</text>
      <ellipse cx="12" cy="10" rx="4" ry="2.2" fill="rgba(255,255,255,0.55)"/>
    </svg>
    <span class="value" data-balance>0</span>
  </div></div>
  
</div>

<div class="wheel-wrapper">
  <div class="wheel-top-pointer">
    <svg viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ptGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fcf6ba"/>
          <stop offset="40%" stop-color="#bf953f"/>
          <stop offset="100%" stop-color="#5c3a09"/>
        </linearGradient>
      </defs>
      <path d="M4 4 Q4 1, 7 1 L23 1 Q26 1, 26 4 L15 36 Z"
            fill="url(#ptGold)" stroke="#5c3a09" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M6 4 Q6 3, 7 3 L23 3 Q24 3, 24 4 L15 20 Z"
            fill="rgba(255,255,255,0.5)"/>
    </svg>
  </div>

  <svg class="wheel-disc" id="wheel" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fcf6ba"/>
        <stop offset="25%" stop-color="#bf953f"/>
        <stop offset="50%" stop-color="#8b6508"/>
        <stop offset="75%" stop-color="#bf953f"/>
        <stop offset="100%" stop-color="#fcf6ba"/>
      </linearGradient>
      <linearGradient id="goldRingInner" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#b38728"/>
        <stop offset="50%" stop-color="#fcf6ba"/>
        <stop offset="100%" stop-color="#8b6508"/>
      </linearGradient>
      <radialGradient id="gRed" cx="50%" cy="50%" r="85%">
        <stop offset="0%" stop-color="#7a0d0d"/>
        <stop offset="45%" stop-color="#a31616"/>
        <stop offset="80%" stop-color="#d62828"/>
        <stop offset="100%" stop-color="#8b1414"/>
      </radialGradient>
      <radialGradient id="gCream" cx="50%" cy="50%" r="85%">
        <stop offset="0%" stop-color="#c9a45c"/>
        <stop offset="45%" stop-color="#e6c98a"/>
        <stop offset="80%" stop-color="#f7e5b8"/>
        <stop offset="100%" stop-color="#c9a45c"/>
      </radialGradient>
      <radialGradient id="bulbGold" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="25%" stop-color="#fcf6ba"/>
        <stop offset="60%" stop-color="#bf953f"/>
        <stop offset="100%" stop-color="#8b6508"/>
      </radialGradient>
    </defs>

    <circle cx="100" cy="100" r="94" fill="none" stroke="#6b4f10" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldRing)" stroke-width="8"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>
    <circle cx="100" cy="100" r="88.2" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="0.8"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldRingInner)" stroke-width="1.2"/>

    <!-- Segments (order: ✖, ×2, ×1.5, ×1, ×0.5, ×2.5 — shuffled & fixed) -->
    <g>
      <path d="M100,100 L100,15 A85,85 0 0,1 173.6,57.5 Z" fill="url(#gRed)"/>
      <path d="M100,100 L173.6,57.5 A85,85 0 0,1 173.6,142.5 Z" fill="url(#gCream)"/>
      <path d="M100,100 L173.6,142.5 A85,85 0 0,1 100,185 Z" fill="url(#gRed)"/>
      <path d="M100,100 L100,185 A85,85 0 0,1 26.4,142.5 Z" fill="url(#gCream)"/>
      <path d="M100,100 L26.4,142.5 A85,85 0 0,1 26.4,57.5 Z" fill="url(#gRed)"/>
      <path d="M100,100 L26.4,57.5 A85,85 0 0,1 100,15 Z" fill="url(#gCream)"/>
    </g>

    <g stroke="rgba(252,246,186,0.35)" stroke-width="0.5">
      <line x1="100" y1="100" x2="100" y2="15"/>
      <line x1="100" y1="100" x2="173.6" y2="57.5"/>
      <line x1="100" y1="100" x2="173.6" y2="142.5"/>
      <line x1="100" y1="100" x2="100" y2="185"/>
      <line x1="100" y1="100" x2="26.4" y2="142.5"/>
      <line x1="100" y1="100" x2="26.4" y2="57.5"/>
    </g>

    <g id="bulbs"></g>

    <!-- Labels: shuffled & fixed order (seg 0 = ✖, seg 1 = ×2, seg 2 = ×1.5, seg 3 = ×1, seg 4 = ×0.5, seg 5 = ×2.5) -->
    <g font-family="Cairo, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">

      <!-- Segment 0 : ✖ -->
      <g transform="rotate(30 100 100)">
        <g transform="translate(100 45) rotate(-30)">
          <text x="0" y="0" font-size="18" fill="#FFF3D6"
                style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">✖</text>
        </g>
      </g>

      <!-- Segment 1 : ×2 -->
      <g transform="rotate(90 100 100)">
        <g transform="translate(100 45) rotate(-90)">
          <text x="0" y="0" font-size="13" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">×2</text>
        </g>
      </g>

      <!-- Segment 2 : ×1.5 -->
      <g transform="rotate(150 100 100)">
        <g transform="translate(100 45) rotate(-150)">
          <text x="0" y="0" font-size="13" fill="#FFF3D6"
                style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">×1.5</text>
        </g>
      </g>

      <!-- Segment 3 : ×1 -->
      <g transform="rotate(210 100 100)">
        <g transform="translate(100 45) rotate(-210)">
          <text x="0" y="0" font-size="13" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">×1</text>
        </g>
      </g>

      <!-- Segment 4 : ×0.5 -->
      <g transform="rotate(270 100 100)">
        <g transform="translate(100 45) rotate(-270)">
          <text x="0" y="0" font-size="13" fill="#FFF3D6"
                style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">×0.5</text>
        </g>
      </g>

      <!-- Segment 5 : ×2.5 -->
      <g transform="rotate(330 100 100)">
        <g transform="translate(100 45) rotate(-330)">
          <text x="0" y="0" font-size="13" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">×2.5</text>
        </g>
      </g>

    </g>
  </svg>

  <div class="wheel-center">SPIN</div>
</div>

<div class="section">
  <div class="section-label">💰 مبلغ اللعب (1 - 100):</div>
  <input type="text" inputmode="numeric" pattern="[0-9]*" class="amount-input" id="amountInput" placeholder="اكتب المبلغ" oninput="capAmount(this)">
  <div class="quick-btns">
    <button class="quick-btn" onclick="setAmount(5, this)">5</button>
    <button class="quick-btn" onclick="setAmount(10, this)">10</button>
    <button class="quick-btn" onclick="setAmount(25, this)">25</button>
    <button class="quick-btn" onclick="setAmount(50, this)">50</button>
    <button class="quick-btn" onclick="setAmount(75, this)">75</button>
    <button class="quick-btn" onclick="setAmount(100, this)">100</button>
  </div>
</div>

<button class="play-btn" id="playBtn" onclick="spin()">أدر العجلة 🎡</button>

<div class="info">🎯 كل قطاع بيضاعف مبلغك</div>



<script src="app.js"></script>
<script>
function capAmount(input) {
  // Remove any non-digit characters
  input.value = input.value.replace(/[^0-9]/g, '');
  let v = Number(input.value);
  if (v > 100) input.value = 100;
  else if (v < 1 && input.value !== '') input.value = 1;
}

function setAmount(v, btn) {
  document.getElementById('amountInput').value = v;
  document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Fixed shuffled order mapped to positions on wheel (0=top-right going clockwise)
// Position: 0 → ✖ (40%), 1 → ×2 (5%), 2 → ×1.5 (14%), 3 → ×1 (18%), 4 → ×0.5 (22%), 5 → ×2.5 (1%)
const SEGMENTS = [
  { mult: 0,   weight: 40 },  // ✖
  { mult: 2,   weight: 5  },  // ×2
  { mult: 1.5, weight: 14 },  // ×1.5
  { mult: 1,   weight: 18 },  // ×1
  { mult: 0.5, weight: 22 },  // ×0.5
  { mult: 2.5, weight: 1  }   // ×2.5
];

const TOTAL_WEIGHT = SEGMENTS.reduce((s, x) => s + x.weight, 0);
const SEGMENT_DEG = 60;
let spinning = false;
let currentRotation = 0;

function pickWeightedIndex() {
  let r = Math.random() * TOTAL_WEIGHT;
  for (let i = 0; i < SEGMENTS.length; i++) {
    if (r < SEGMENTS[i].weight) return i;
    r -= SEGMENTS[i].weight;
  }
  return SEGMENTS.length - 1;
}

function spin() {
  if (spinning) return;

  const amountInput = document.getElementById('amountInput');
  let amount = Number(amountInput.value);

  if (!amount || amount < 1) { PW.showToast('اكتب مبلغ صحيح'); return; }
  if (amount > 100) { PW.showToast('الحد الأقصى 100'); return; }

  const balance = PW.getBalance();
  if (balance < amount) { PW.showToast('رصيدك غير كافٍ'); return; }

  spinning = true;
  PW.setBalance(balance - amount);

  const btn = document.getElementById('playBtn');
  btn.disabled = true;

  const winnerIndex = pickWeightedIndex();
  const seg = SEGMENTS[winnerIndex];

  const segCenter = winnerIndex * SEGMENT_DEG + SEGMENT_DEG / 2;
  const jitter = (Math.random() - 0.5) * (SEGMENT_DEG - 16);
  const targetMod = (360 - segCenter - jitter + 360) % 360;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = (targetMod - currentMod + 360) % 360;
  const finalRotation = currentRotation + 360 * 5 + delta;

  const wheel = document.getElementById('wheel');
  wheel.style.transform = 'rotate(' + finalRotation + 'deg)';
  currentRotation = finalRotation;

  setTimeout(() => {
    if (seg.mult === 0) {
      PW.showToast('❌ خسرت ' + amount + ' كوين');
    } else {
      const reward = Math.round((amount * seg.mult) * 100) / 100;
      PW.addBalance(reward);
      if (seg.mult > 1) {
        PW.showToast('🎉 ×' + seg.mult + ' → +' + reward + ' كوين');
      } else if (seg.mult === 1) {
        PW.showToast('↩️ ×1 → رجعلك ' + reward + ' كوين');
      } else {
        PW.showToast('😐 ×0.5 → رجعلك ' + reward + ' كوين');
      }
    }
    spinning = false;
    btn.disabled = false;
  }, 5100);
}

(function() {
  const group = document.getElementById('bulbs');
  const count = 24;
  const radius = 92;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
    const x = 100 + Math.cos(angle) * radius;
    const y = 100 + Math.sin(angle) * radius;
    const bulb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    bulb.setAttribute('cx', x.toFixed(2));
    bulb.setAttribute('cy', y.toFixed(2));
    bulb.setAttribute('r', '1.8');
    bulb.setAttribute('fill', 'url(#bulbGold)');
    bulb.setAttribute('stroke', 'rgba(139,101,8,0.6)');
    bulb.setAttribute('stroke-width', '0.3');
    group.appendChild(bulb);
  }
})();
</script>

</body>
