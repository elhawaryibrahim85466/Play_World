<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>عجلة الحظ - PlayWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #0D0F1D;
  background-image:
    radial-gradient(circle at 50% 35%, rgba(245,158,11,0.18) 0%, transparent 50%),
    radial-gradient(circle at 15% 10%, rgba(139,92,246,0.18), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(6,182,212,0.12), transparent 40%);
  background-attachment: fixed;
}
.wheel-wrapper { position: relative; width: 320px; height: 320px; margin: 60px auto 30px; }
.center-overlay {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 6; overflow: visible;
}
.wheel-disc {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: 50%;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
  transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
  transform-origin: 50% 50%;
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}
.spin-btn {
  display: block; margin: 0 auto 14px;
  width: 100%; max-width: 320px;
  background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 40%, #D97706 100%);
  color: #0D0F1D; font-weight: 900; font-size: 16px;
  padding: 16px 0; border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.35);
  cursor: pointer; font-family: inherit;
  box-shadow: 0 8px 25px rgba(245,158,11,0.4), 0 4px 0 #92400E, inset 0 1px 0 rgba(255,255,255,0.5);
  transition: transform 0.1s ease;
}
.spin-btn:active { transform: translateY(3px); }
.spin-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.prize-info { text-align: center; margin-top: 14px; font-size: 12px; color: #9CA3AF; font-weight: 700; }
</style>
</head>

</div>

        <stop offset="100%" stop-color="#8b6508"/>
      </linearGradient>

        <stop offset="50%" stop-color="#fcf6ba"/>
        <stop offset="100%" stop-color="#8b6508"/>
      </linearGradient>

      <path d="M100,100 L26.4,142.5 A85,85 0 0,1 26.4,57.5 Z" fill="url(#gRed)"/>

      <line x1="100" y1="100" x2="173.6" y2="57.5"/>

      <g transform="rotate(30 100 100)">
        <g transform="translate(100 45) rotate(-30)">
          <text x="0" y="0" font-size="18" fill="#FFF3D6" style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">✖</text>
        </g>
      </g>

      <!-- 10 - segment 1 (CREAM), center 90° → 25% -->
      <g transform="rotate(90 100 100)">
        <g transform="translate(100 45) rotate(-90)">
          <text x="0" y="0" font-size="14" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">10</text>
        </g>
      </g>

      <!-- 50 - segment 2 (RED), center 150° → 20% -->
      <g transform="rotate(150 100 100)">
        <g transform="translate(100 45) rotate(-150)">
          <text x="0" y="0" font-size="14" fill="#FFF3D6"
                style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">50</text>
        </g>
      </g>

      <!-- 100 - segment 3 (CREAM), center 210° → 12% -->
      <g transform="rotate(210 100 100)">
        <g transform="translate(100 45) rotate(-210)">
          <text x="0" y="0" font-size="13" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">100</text>
        </g>
      </g>

      <!-- 250 - segment 4 (RED), center 270° → 6% -->
      <g transform="rotate(270 100 100)">
        <g transform="translate(100 45) rotate(-270)">
          <text x="0" y="0" font-size="13" fill="#FFF3D6"
                style="paint-order:stroke; stroke:#5C0A0A; stroke-width:0.9; stroke-linejoin:round;">250</text>
        </g>
      </g>

      <!-- 500 - segment 5 (CREAM), center 330° → 2% -->
      <g transform="rotate(330 100 100)">
        <g transform="translate(100 45) rotate(-330)">
          <text x="0" y="0" font-size="13" fill="#8B1A1A"
                style="paint-order:stroke; stroke:#FFF3D6; stroke-width:0.9; stroke-linejoin:round;">500</text>
        </g>
      </g>

    </g>
  </svg>

  <svg class="center-overlay" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="centerVelvet" cx="35%" cy="30%" r="75%">

        <stop offset="80%" stop-color="#8b1414"/>
        <stop offset="100%" stop-color="#4a0606"/>
      </radialGradient>
      <radialGradient id="centerGoldRing" cx="50%" cy="30%" r="80%">

        <stop offset="40%" stop-color="#bf953f"/>
        <stop offset="75%" stop-color="#8b6508"/>
        <stop offset="100%" stop-color="#5c3a09"/>

      <linearGradient id="spinGold" x1="0" y1="0" x2="0" y2="1">

        <stop offset="50%" stop-color="#bf953f"/>
        <stop offset="100%" stop-color="#8b6508"/>

    <circle cx="100" cy="100" r="20" fill="url(#centerGoldRing)" stroke="#5c3a09" stroke-width="0.8"/>
    <circle cx="100" cy="100" r="17" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <circle cx="100" cy="100" r="16" fill="url(#centerVelvet)" stroke="#4a0606" stroke-width="0.6"/>
    <text x="100" y="100" font-family="Cairo, sans-serif" font-size="9" font-weight="900"
          text-anchor="middle" dominant-baseline="central" fill="url(#spinGold)"
          style="letter-spacing:0.5px; paint-order:stroke; stroke:#4a0606; stroke-width:0.6; stroke-linejoin:round;">SPIN</text>
    <ellipse cx="96" cy="94" rx="4" ry="2" fill="rgba(255,255,255,0.25)"/>

    <g filter="url(#ptDrop)">
      <path d="M94 2 Q94 0, 96 0 L104 0 Q106 0, 106 2 L100 18 Z"

      <path d="M95 2 Q95 1, 96 1 L104 1 Q105 1, 105 2 L100 9 Z" fill="rgba(255,255,255,0.6)"/>

<script src="app.js"></script>
<script>
(function() {
  const group = document.getElementById('bulbs');
  const count = 24;
  const radius = 92;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
    const x = 100 + Math.cos(angle) * radius;
    const y = 100 + Math.sin(angle) * radius;
    const bulb = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    bulb.setAttribute('cx', x.toFixed(2));
    bulb.setAttribute('cy', y.toFixed(2));
    bulb.setAttribute('r', '1.8');
    bulb.setAttribute('fill', 'url(#bulbGold)');
    bulb.setAttribute('stroke', 'rgba(255,215,120,0.9)');
    bulb.setAttribute('stroke-width', '0.3');
    group.appendChild(bulb);
  }
})();

// ===== Prize config: index 0..5 maps to segments (0=top-right, going clockwise) =====
// Each entry: { value, weight }
// Weights sum = 100 → probability per spin
const PRIZES = [
  { value: 0,   weight: 35 },  // 🥺 - segment 0 (top-right)
  { value: 10,  weight: 25 },  // 10 - segment 1 (right)
  { value: 50,  weight: 20 },  // 50 - segment 2 (bottom-right)
  { value: 100, weight: 12 },  // 100 - segment 3 (bottom-left)
  { value: 250, weight: 6  },  // 250 - segment 4 (left)
  { value: 500, weight: 2  }   // 500 - segment 5 (top-left)
];

const TOTAL_WEIGHT = PRIZES.reduce((s, p) => s + p.weight, 0);
const SEGMENT_DEG = 60;
const SPIN_COST = 50;
let spinning = false;
let currentRotation = 0;

// Weighted random selection
function pickWeightedIndex() {
  let r = Math.random() * TOTAL_WEIGHT;
  for (let i = 0; i < PRIZES.length; i++) {
    if (r < PRIZES[i].weight) return i;
    r -= PRIZES[i].weight;
  }
  return PRIZES.length - 1;
}

function spin() {
  if (spinning) return;
  const balance = PW.getBalance();
  if (balance < SPIN_COST) { PW.showToast('رصيدك غير كافٍ'); return; }
  PW.setBalance(balance - SPIN_COST);
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;

  // Pick winner with weighted probability
  const winnerIndex = pickWeightedIndex();
  const prize = PRIZES[winnerIndex].value;

  // Bring winner segment center under the top pointer (0°)
  const segCenter = winnerIndex * SEGMENT_DEG + SEGMENT_DEG / 2;
  const jitter = (Math.random() - 0.5) * (SEGMENT_DEG - 16);

  // Target absolute rotation angle (mod 360) so that winner is under pointer
  const targetMod = (360 - segCenter - jitter + 360) % 360;

  // Current rotation mod 360
  const currentMod = ((currentRotation % 360) + 360) % 360;
  // How much more we need to rotate to reach target (mod 360)
  let delta = (targetMod - currentMod + 360) % 360;
  // Add 5 full spins
  const finalRotation = currentRotation + 360 * 5 + delta;

  const wheel = document.getElementById('wheel');
  wheel.style.transform = 'rotate(' + finalRotation + 'deg)';
  currentRotation = finalRotation;

  setTimeout(() => {
    if (prize > 0) {
      PW.addBalance(prize);
      PW.showToast('🎉 ربحت ' + prize + ' كوين!');
    } else {
      PW.showToast('❌ حظ أوفر المرة الجاية');
    }
    localStorage.setItem(PW.KEYS.PLAYED_WHEEL, 'true');
    spinning = false;
    btn.disabled = false;
  }, 5100);
}
</script>
